<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnaje | Česká asociace prší</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #1a365d; 
            --secondary: #c53030; /* Červená pro aktivní odkazy a odhlášení */
            --bg: #f4f7f6; 
            --text: #2d3748; 
            --white: #ffffff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; }

        /* --- HLAVIČKA A MENU PODLE SCREENSHOTU --- */
        .main-header { 
            background: var(--white); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 1rem 2rem; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 40px; width: 40px; object-fit: contain; } /* Pokud máš logo.png, načte se */
        .logo-text { font-weight: 800; color: var(--primary); font-size: 1.3rem; letter-spacing: 0.5px; text-transform: uppercase; }

        .main-nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .main-nav a { 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: 600; 
            font-size: 0.95rem; 
            transition: color 0.2s; 
        }
        .main-nav a:hover { color: var(--secondary); }
        .main-nav a.active { color: var(--secondary); }
        
        .nav-logout { color: var(--secondary) !important; } /* Červené tlačítko odhlásit */
        
        /* Třídy pro skrývání podle přihlášení */
        .auth-only { display: none; }
        .admin-only { display: none; }

        /* --- OBSAH STRÁNKY --- */
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 1rem; }

        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 3rem; flex-wrap: wrap; }
        .filter-btn { background: white; border: 2px solid var(--primary); color: var(--primary); padding: 0.6rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; }

        /* Mřížka turnajů */
        .tournament-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }

        /* Karta turnaje */
        .t-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s; display: flex; flex-direction: column; }
        .t-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        
        .t-img-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #e2e8f0; overflow: hidden; }
        .t-img-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .t-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .t-badge { display: inline-block; background: #ebf8ff; color: #2b6cb0; font-size: 0.75rem; font-weight: 800; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; margin-bottom: 0.8rem; width: fit-content; }
        .t-title { font-size: 1.3rem; color: var(--primary); margin-bottom: 0.5rem; line-height: 1.2; }
        .t-info { font-size: 0.95rem; color: #4a5568; margin-bottom: 1.5rem; font-weight: 600; }

        .btn-reg { margin-top: auto; width: 100%; padding: 0.8rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; display: block; font-size: 0.95rem; }
        .btn-reg.available { background: var(--primary); color: white; }
        .btn-reg.available:hover { background: #2c5282; }
        .btn-reg.signed { background: #38a169; color: white; cursor: default; }
        .btn-reg.locked { background: #edf2f7; color: #718096; cursor: pointer; }

        .empty-state { text-align: center; padding: 4rem; grid-column: 1 / -1; color: #a0aec0; font-weight: bold;}

        @media (max-width: 900px) {
            .main-header { flex-direction: column; gap: 15px; }
            .main-nav { justify-content: center; }
        }
    </style>
</head>
<body>

<header class="main-header">
    <a href="index.html" class="logo-area">
        <img src="logo.png" alt="" class="logo-img" onerror="this.style.display='none'">
        <span class="logo-text">Česká asociace prší</span>
    </a>
    
    <nav class="main-nav">
        <a href="index.html">Úvod</a>
        <a href="#">Pravidla</a>
        <a href="#">Pořádejte turnaj</a>
        <a href="turnaje.html" class="active">Turnaje</a>
        <a href="#">Statistiky</a>
        <a href="#">Hlasování a Návrhy</a>
        
        <a href="#" class="auth-only">Můj profil</a>
        <a href="pozvanky.html" class="admin-only">Administrace</a>
        
        <a href="index.html" id="navLoginBtn">Přihlásit</a>
        <a href="#" id="navLogoutBtn" class="nav-logout auth-only" onclick="logout()">Odhlásit</a>
    </nav>
</header>

<div class="container">
    <div class="filters">
        <button class="filter-btn active" onclick="filterTurnaje('vse')">Všechny kraje</button>
        <button class="filter-btn" onclick="filterTurnaje('mb')">Mladoboleslavsko</button>
        <button class="filter-btn" onclick="filterTurnaje('zl')">Zlínsko</button>
    </div>

    <div id="tournamentGrid" class="tournament-grid">
        <div class="empty-state">Načítám turnaje...</div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://gqciprgrzdpckhhqcsjx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY2lwcmdyemRwY2toaHFjc2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTk4MDksImV4cCI6MjA5MTU3NTgwOX0.6ptq3mzu-RmWn2pKJFDY7Wk3syckQObPFjEfYRgEK-k';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let turnajeData = [];

    // Inicializace a kontrola přihlášení
    async function init() {
        const { data: { session } } = await db.auth.getSession();
        
        if (session) {
            currentUser = session.user;
            
            // Skrýt tlačítko "Přihlásit" a zobrazit "Odhlásit" a "Můj profil"
            document.getElementById('navLoginBtn').style.display = 'none';
            document.querySelectorAll('.auth-only').forEach(el => el.style.display = 'inline-block');

            // Kontrola role pro zobrazení Administrace
            const { data: profile } = await db.from('profiles').select('role').eq('id', currentUser.id).single();
            if (profile && ['pc', 'zc', 'zcp', 'superadmin'].includes(profile.role)) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
            }
        }

        loadTurnaje();
    }

    // Odhlášení
    async function logout() {
        await db.auth.signOut();
        window.location.href = 'index.html';
    }

    async function loadTurnaje() {
        // Zatím simulujeme data pro ukázku (později napojíme na databázi)
        turnajeData = [
            {
                id: 1,
                title: "4. Hasičská Kapka v Bukovnu",
                date: "18. dubna 2026",
                loc: "Naše hospoda Bukovensko",
                img: "https://www.asociaceprsi.cz/Bukovnoclear.png", // Demo obrázek
                kraj: "mb",
                kraj_label: "Mladoboleslavsko"
            },
            {
                id: 2,
                title: "Jarní turnaj Slunečno",
                date: "22. února 2026",
                loc: "Penzión Slunečno",
                img: "https://www.asociaceprsi.cz/clear.png", // Demo obrázek
                kraj: "mb",
                kraj_label: "Mladoboleslavsko"
            }
        ];

        renderTurnaje(turnajeData);
    }

    function renderTurnaje(data) {
        const grid = document.getElementById('tournamentGrid');
        if (data.length === 0) {
            grid.innerHTML = `<div class="empty-state">Aktuálně nejsou plánovány žádné turnaje v této oblasti.</div>`;
            return;
        }

        grid.innerHTML = data.map(t => {
            let actionBtn = '';
            if (!currentUser) {
                actionBtn = `<a href="index.html" class="btn-reg locked">Pro registraci se přihlaste</a>`;
            } else {
                actionBtn = `<button class="btn-reg available" onclick="registrovatHrace(${t.id})">Registrovat se na turnaj</button>`;
            }

            return `
                <div class="t-card">
                    <div class="t-img-wrapper">
                        <img src="${t.img}" alt="${t.title}">
                    </div>
                    <div class="t-content">
                        <span class="t-badge">${t.kraj_label}</span>
                        <h2 class="t-title">${t.title}</h2>
                        <p class="t-info">
                            📅 ${t.date}<br>
                            📍 ${t.loc}
                        </p>
                        ${actionBtn}
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterTurnaje(kraj) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.toLowerCase().includes(kraj) || (kraj === 'vse' && btn.innerText.includes('Všechny'))) {
                btn.classList.add('active');
            }
        });

        if (kraj === 'vse') {
            renderTurnaje(turnajeData);
        } else {
            const filtered = turnajeData.filter(t => t.kraj === kraj);
            renderTurnaje(filtered);
        }
    }

    async function registrovatHrace(tournamentId) {
        if (!currentUser) return;
        alert("Skvělé! Právě jsi se registroval na turnaj. (Toto brzy napojíme na ostrou databázi)");
    }

    // Spuštění
    init();
</script>

</body>
</html>
