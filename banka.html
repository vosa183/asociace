<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankovní náhled | Česká asociace prší</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #1a365d; --secondary: #c53030; --bg: #f4f7f6; --white: #ffffff; --green: #2f855a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #2d3748; padding: 2rem; }
        .card { background: var(--white); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
        header { background: var(--primary); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; border-radius: 8px; margin-bottom: 2rem; }
        header a { color: white; text-decoration: none; font-weight: bold; padding: 0.5rem 1rem; border: 1px solid white; border-radius: 6px; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--secondary); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .balance-box { background: #ebf8ff; padding: 1.5rem; border-radius: 8px; border: 1px solid #90cdf4; margin-bottom: 2rem; text-align: center; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .stats-table th, .stats-table td { padding: 0.8rem; border-bottom: 1px solid #ddd; text-align: left; }
        .stats-table th { background: var(--primary); color: white; }
        .loading { text-align: center; padding: 2rem; font-weight: bold; }
        .error-msg { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; padding: 1.5rem; border-radius: 8px; font-weight: bold; }
        .debug-log { background: #1a202c; color: #48bb78; padding: 1.5rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; margin-top: 1rem; text-align: left; border: 2px solid #4a5568; }
        .warning-box { background: #fffbeb; border: 1px solid #f6e05e; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; color: #b7791f; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>NÁHLED FIO BANKY</h1>
    <a href="index.html">⬅ Zpět do administrace</a>
</header>

<main>
    <div class="card">
        <h2>Přehled účtu asociace</h2>
        <div class="warning-box">
            <strong>⚠️ PRAVIDLO 60 SEKUND:</strong> Mezi každým načtením této stránky musíte počkat minimálně 1 minutu, jinak Fio banka spojení odřízne.
        </div>
        <div id="bankContent" class="loading">Ověřuji oprávnění a stahuji data přes zabezpečený tunel... ⏳</div>
    </div>
</main>

<script>
    const supabaseUrl = 'https://gqciprgrzdpckhhqcsjx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY2lwcmdyemRwY2toaHFjc2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTk4MDksImV4cCI6MjA5MTU3NTgwOX0.6ptq3mzu-RmWn2pKJFDY7Wk3syckQObPFjEfYRgEK-k';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    window.addEventListener('DOMContentLoaded', async function() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }
        
        const { data: prof } = await db.from('profiles').select('role').eq('id', user.id).single();
        if (!prof || prof.role !== 'superadmin') {
            alert('Přístup povolen pouze pro Super Admina.');
            window.location.href = 'index.html';
            return;
        }

        const { data: settings } = await db.from('system_settings').select('fio_token').eq('id', 1).single();
        if (!settings || !settings.fio_token) {
            document.getElementById('bankContent').innerHTML = '<div class="error-msg">API klíč pro Fio banku nebyl v systému nalezen.</div>';
            return;
        }

        fetchAndRenderBankData(settings.fio_token);
    });

    // Funkce pro správné lokální české datum (vyhne se UTC posunu)
    function getLocalDateString(d) {
        var year = d.getFullYear();
        var month = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return year + '-' + month + '-' + day;
    }

    async function fetchAndRenderBankData(token) {
        let diagnostika = "START DIAGNOSTIKY\n=================\n";
        try {
            var cleanToken = token.trim(); 
            diagnostika += "1. Token vyčištěn (Délka: " + cleanToken.length + " znaků)\n";

            // Opravený výpočet data pomocí lokálního času
            var toDate = new Date();
            var fromDate = new Date();
            fromDate.setDate(toDate.getDate() - 14);
            
            var fStr = getLocalDateString(fromDate);
            var tStr = getLocalDateString(toDate);
            diagnostika += "2. Časové okno (Lokální CZ čas): " + fStr + " až " + tStr + "\n";

            var fioUrl = 'https://www.fio.cz/ib_api/rest/periods/' + cleanToken + '/' + fStr + '/' + tStr + '/transactions.json';
            
            // Měníme typ proxy volání - obalujeme to do JSONP formátu, to by banku mohlo zmást méně
            var proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(fioUrl);
            diagnostika += "3. Volám přes JSONP Proxy tunel...\n";

            var response = await fetch(proxyUrl);
            diagnostika += "4. Server odpověděl. HTTP Status: " + response.status + " " + response.statusText + "\n";
            
            var proxyData = await response.json();
            
            if (!proxyData.contents) {
                throw new Error("Proxy tunel vrátil prázdný obsah. Banka nás pravděpodobně blokuje.");
            }
            
            var rawText = proxyData.contents;
            diagnostika += "5. Surová data z banky obdržena.\n";

            var data;
            try {
                data = JSON.parse(rawText);
            } catch(e) {
                diagnostika += "OBSAH CHYBY:\n" + rawText.substring(0, 500) + "\n";
                throw new Error("Banka vrátila chybovou stránku místo dat.");
            }

            if (!data || !data.accountStatement) {
                throw new Error("Objekt accountStatement nenalezen.");
            }

            diagnostika += "6. Data platná, vykresluji HTML tabulku...\n";
            var info = data.accountStatement.info;
            var trans = data.accountStatement.transactionList.transaction || [];

            var html = '<div class="balance-box"><h3>' + info.closingBalance.toLocaleString('cs-CZ') + ' ' + info.currency + '</h3><p>Zůstatek k dnešnímu dni (' + info.iban + ')</p></div>';
            html += '<h3>Historie pohybů (posledních 14 dní)</h3>';
            
            if (trans.length === 0) {
                html += '<p style="color:#718096; padding-top:1rem;">Za posledních 14 dní neproběhly na účtu žádné pohyby.</p>';
            } else {
                html += '<table class="stats-table"><tr><th>Datum</th><th>VS</th><th>Zpráva</th><th>Částka</th></tr>';
                trans.reverse().forEach(function(t) {
                    var datum = t.column0 ? t.column0.value.split('+')[0] : '-';
                    var castka = t.column1 ? parseFloat(t.column1.value) : 0;
                    var vs = t.column5 ? t.column5.value : '-';
                    var zprava = t.column16 ? t.column16.value : '-';
                    
                    html += '<tr><td>' + datum.split('-').reverse().join('.') + '</td><td>' + vs + '</td><td>' + zprava + '</td><td style="font-weight:bold; color:'+(castka>0?'var(--green)':'var(--secondary)')+'">' + castka.toLocaleString('cs-CZ') + '</td></tr>';
                });
                html += '</table>';
            }
            
            document.getElementById('bankContent').innerHTML = html;

        } catch (err) {
            diagnostika += "\n>>> KRITICKÁ CHYBA: " + err.message + "\n";
            
            var errorHtml = '<div class="error-msg">❌ Aplikaci se nepodařilo přečíst data z banky.</div>';
            errorHtml += '<div class="debug-log">' + diagnostika + '</div>';
            
            document.getElementById('bankContent').innerHTML = errorHtml;
        }
    }
</script>
</body>
</html>
