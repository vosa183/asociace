<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankovní náhled | Česká asociace prší</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #1a365d; --secondary: #c53030; --bg: #f4f7f6; --white: #ffffff; --green: #2f855a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: #2d3748; padding: 2rem; }
        .card { background: var(--white); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--secondary); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .balance-box { background: #ebf8ff; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; text-align: center; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .stats-table th, .stats-table td { padding: 0.8rem; border-bottom: 1px solid #ddd; text-align: left; }
        .loading { text-align: center; padding: 2rem; font-weight: bold; }
    </style>
</head>
<body>

<main>
    <div class="card">
        <h2>Přehled Fio účtu</h2>
        <div id="bankContent" class="loading">Načítám zabezpečený náhled...</div>
    </div>
</main>

<script>
    const supabaseUrl = 'https://gqciprgrzdpckhhqcsjx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY2lwcmdyemRwY2toaHFjc2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTk4MDksImV4cCI6MjA5MTU3NTgwOX0.6ptq3mzu-RmWn2pKJFDY7Wk3syckQObPFjEfYRgEK-k';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    window.addEventListener('DOMContentLoaded', async function() {
        // 1. Ověření uživatele a role
        const { data: { user } } = await db.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }
        
        const { data: prof } = await db.from('profiles').select('role').eq('id', user.id).single();
        if (!prof || prof.role !== 'superadmin') {
            alert('Přístup povolen pouze pro Super Admina.');
            window.location.href = 'index.html';
            return;
        }

        // 2. Načtení API klíče
        const { data: settings } = await db.from('system_settings').select('fio_token').eq('id', 1).single();
        if (!settings || !settings.fio_token) {
            document.getElementById('bankContent').innerHTML = 'API klíč pro Fio banku nebyl nalezen.';
            return;
        }

        runBankCheck(settings.fio_token);
    });

    async function runBankCheck(token) {
        try {
            var toDate = new Date();
            var fromDate = new Date();
            fromDate.setDate(toDate.getDate() - 14);
            var fStr = fromDate.toISOString().split('T')[0];
            var tStr = toDate.toISOString().split('T')[0];

            var fioUrl = 'https://www.fio.cz/ib_api/rest/periods/' + token + '/' + fStr + '/' + tStr + '/transactions.json';
            var response = await fetch('https://corsproxy.io/?' + encodeURIComponent(fioUrl));
            var data = await response.json();

            if (!data || !data.accountStatement) throw new Error("Data z banky nedostupná.");

            var info = data.accountStatement.info;
            var trans = data.accountStatement.transactionList.transaction || [];

            var html = '<div class="balance-box"><h3>' + info.closingBalance.toLocaleString('cs-CZ') + ' ' + info.currency + '</h3><p>Zůstatek k dnešnímu dni</p></div>';
            html += '<table class="stats-table"><tr><th>Datum</th><th>VS</th><th>Popis</th><th>Částka</th></tr>';
            
            trans.reverse().forEach(function(t) {
                var datum = t.column0 ? t.column0.value.split('+')[0] : '-';
                var castka = t.column1 ? parseFloat(t.column1.value) : 0;
                var vs = t.column5 ? t.column5.value : '-';
                var zprava = t.column16 ? t.column16.value : '-';
                
                html += '<tr><td>' + datum.split('-').reverse().join('.') + '</td><td>' + vs + '</td><td>' + zprava + '</td><td style="font-weight:bold; color:'+(castka>0?'var(--green)':'var(--secondary)')+'">' + castka + '</td></tr>';
            });
            
            document.getElementById('bankContent').innerHTML = html + '</table>';
        } catch (err) {
            document.getElementById('bankContent').innerHTML = 'Chyba: ' + err.message;
        }
    }

    // Automatická kontrola každou celou hodinu
    function scheduleBankCheck() {
        const now = new Date();
        const msToNextHour = (60 - now.getMinutes()) * 60000 - (now.getSeconds() * 1000) - now.getMilliseconds();
        setTimeout(function() {
            // Tady se provede kontrola; pokud je potřeba ji volat opakovaně, 
            // stačí v rámci administrace znovu zavolat funkci runBankCheck(token)
            setInterval(function() { console.log("Kontrola banky proběhla."); }, 3600000);
        }, msToNextHour);
    }
    scheduleBankCheck();
</script>
</body>
</html>
