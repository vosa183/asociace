<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odbavení příchozích – Česká asociace prší</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root{ --bg:#1e1e1e; --card:#2d2d2d; --line:#444; --text:#fff; --gold:#f1c40f; --blue:#3498db; --green:#27ae60; --red:#c0392b; --orange:#e67e22; }
  *{box-sizing:border-box;} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:#171717;position:sticky;top:0;}
  header .brand{font-weight:bold;color:var(--gold);}
  header a{color:#bdc3c7;text-decoration:none;font-size:.85rem;}
  .wrap{max-width:520px;margin:0 auto;padding:1rem;}
  .msg{text-align:center;color:#bdc3c7;margin-top:2rem;font-size:1.1rem;}
  .btn{border:none;border-radius:10px;padding:1rem;font-weight:bold;font-size:1.1rem;cursor:pointer;width:100%;margin-top:.6rem;}
  .btn-scan{background:var(--gold);color:#111;} .btn-blue{background:var(--blue);color:#fff;} .btn-green{background:var(--green);color:#fff;} .btn-orange{background:var(--orange);color:#fff;} .btn-grey{background:#7f8c8d;color:#fff;}
  input{width:100%;padding:1rem;font-size:1.3rem;text-align:center;border-radius:8px;border:1px solid #555;background:#222;color:var(--gold);font-weight:bold;margin:.4rem 0;}
  #reader{width:100%;max-width:360px;margin:.6rem auto;display:none;}
  .card{background:var(--card);border-radius:12px;padding:1rem;margin-top:1rem;}
  .who{background:#222;border-radius:8px;padding:.6rem;color:#bdc3c7;font-size:.85rem;margin-bottom:.6rem;}
  .big{font-size:1.6rem;font-weight:bold;}
  .tag{display:inline-block;padding:.2rem .6rem;border-radius:6px;font-weight:bold;font-size:.9rem;}
  .paid{background:var(--green);} .debt{background:var(--red);} .warn{background:var(--orange);}
  .picker a{display:block;background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:.9rem;margin:.5rem 0;color:#fff;text-decoration:none;font-weight:bold;}
</style>
</head>
<body>
<header><span class="brand">🎫 Odbavení příchozích</span><a href="index.html">← web</a></header>
<div class="wrap"><div id="app"><div class="msg">Načítám…</div></div></div>

<script>
const supabaseUrl = 'https://gqciprgrzdpckhhqcsjx.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY2lwcmdyemRwY2toaHFjc2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTk4MDksImV4cCI6MjA5MTU3NTgwOX0.6ptq3mzu-RmWn2pKJFDY7Wk3syckQObPFjEfYRgEK-k';
const db = window.supabase.createClient(supabaseUrl, supabaseKey);
const app = document.getElementById('app');
let token=null, role=null, tid=null, tname='';
let qr=null, scanning=false, wakeLock=null;

function esc(s){ return (''+(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepAwake(); });

async function init(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ app.innerHTML='<div class="msg">Nejsi přihlášen. Přihlas se na <a href="index.html" style="color:var(--gold)">webu</a> svým členským účtem a otevři tuto stránku znovu.</div>'; return; }
  token = session.access_token;
  const myId = session.user.id;
  const { data: prof } = await db.from('profiles').select('role,full_name').eq('id', myId).maybeSingle();
  role = prof?.role;
  keepAwake();
  // Aktivní turnaje, KDE JSEM PŘIŘAZENÝ POŘADATEL (superadmin vidí všechny).
  const { data: live } = await db.from('live_state').select('tournament_id, updated_at, organizer_id, tournaments(title)').eq('is_active', true);
  let fresh = (live||[]).filter(l=>!l.updated_at || (Date.now()-new Date(l.updated_at).getTime())<20000);
  fresh = fresh.filter(l => (l.organizer_id||'').split(',').map(s=>s.trim()).includes(myId));
  if(fresh.length===0){ app.innerHTML='<div class="msg">Nejsi přiřazený pořadatel žádného právě běžícího turnaje.<br><span style="font-size:.9rem">(Pořadatele nastaví v aplikaci při načtení turnaje – klidně i sebe.)</span></div>'; return; }
  if(fresh.length===1){ tid=fresh[0].tournament_id; tname=fresh[0].tournaments?.title||''; return renderScanner(); }
  let h='<div class="msg">Vyber turnaj:</div><div class="picker">';
  fresh.forEach(f=>{ h+=`<a href="#" onclick="pick('${f.tournament_id}','${esc((f.tournaments?.title||'').replace(/'/g,"\\'"))}');return false;">🃏 ${esc(f.tournaments?.title||'Turnaj')}</a>`; });
  app.innerHTML=h+'</div>';
}
window.pick=function(id,name){ tid=id; tname=name; renderScanner(); };

function renderScanner(){
  app.innerHTML = `
    <div class="who">Odbavuje: <b>${esc(role.toUpperCase())}</b> · Turnaj: <b>${esc(tname)}</b></div>
    <button class="btn btn-scan" onclick="startScan()">📷 Naskenovat kartičku</button>
    <div id="reader"></div>
    <div style="text-align:center;color:#7f8c8d;margin:.6rem 0;">nebo ručně</div>
    <input type="number" id="manVs" placeholder="ID hráče (číslo)">
    <button class="btn btn-grey" onclick="lookup(document.getElementById('manVs').value)">Vyhledat</button>
    <div id="out"></div>`;
}
function startScan(){
  const r=document.getElementById('reader'); r.style.display='block';
  if(qr==null) qr=new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:240}, tx=>{ if(scanning)return; scanning=true; qr.stop().then(()=>{r.style.display='none';scanning=false;lookup(tx);}).catch(()=>{scanning=false;}); }, ()=>{}).catch(e=>alert('Chyba kamery: '+e));
}
async function lookup(raw){
  const vs=(''+raw).replace(/\D/g,''); const out=document.getElementById('out');
  if(!vs){ out.innerHTML=''; return; }
  out.innerHTML='<div class="msg">Hledám…</div>';
  try{
    const r = await fetch('/api/checkin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'lookup',tournament_id:tid,player_id_card:vs,organizer_token:token})});
    const d = await r.json();
    if(!r.ok){ out.innerHTML='<div class="card" style="border:1px solid var(--red)">'+esc(d.error||'Chyba')+'</div>'; return; }
    const due = Math.max(0, Math.round(d.due != null ? d.due : (d.fee||0)));
    let statusTag = d.registered ? (d.paid ? '<span class="tag paid">ZAPLACENO PŘEDEM</span>' : '<span class="tag debt">PŘIHLÁŠEN</span>') : '<span class="tag warn">NENÍ V SEZNAMU (z ulice)</span>';
    const bigAmt = due>0
      ? `<div style="font-size:2.2rem;font-weight:bold;color:var(--gold);margin:.5rem 0">VYBRAT: ${due} Kč</div>`
      : `<div style="font-size:1.5rem;font-weight:bold;color:var(--green);margin:.5rem 0">✅ Nic nevybírat (zaplaceno)</div>`;
    out.innerHTML = `<div class="card">
        <div class="big">${esc(d.name)}</div>
        <div style="margin:.4rem 0">${statusTag}</div>
        ${bigAmt}
        <button class="btn btn-green" onclick="commit('${vs}',${due},'card')">✅ ODBAVIT (vybráno ${due} Kč)</button>
        <button class="btn btn-grey" onclick="clearOut()">Zrušit</button>
      </div>`;
  }catch(e){ out.innerHTML='<div class="card" style="border:1px solid var(--red)">Chyba spojení.</div>'; }
}
function clearOut(){ const o=document.getElementById('out'); if(o) o.innerHTML=''; const m=document.getElementById('manVs'); if(m) m.value=''; }
async function commitAmt(vs, method){ const el=document.getElementById('amt'); const amt=parseInt(el&&el.value,10)||0; return commit(vs, amt, method); }
async function commit(vs, amount, method){
  const out=document.getElementById('out'); out.innerHTML='<div class="msg">Odbavuji…</div>';
  try{
    const r = await fetch('/api/checkin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'commit',tournament_id:tid,player_id_card:vs,amount_paid:amount,method:method,organizer_token:token})});
    const d = await r.json();
    if(r.ok && d.ok){
      out.innerHTML='<div class="card" style="text-align:center;border:2px solid var(--green)"><div class="big" style="color:var(--green)">✅ ODBAVENO</div><div style="color:#bdc3c7;font-size:.9rem">Otevírám skener pro dalšího…</div></div>';
      const m=document.getElementById('manVs'); if(m) m.value='';
      setTimeout(()=>{ const o=document.getElementById('out'); if(o)o.innerHTML=''; startScan(); }, 1200);
    }
    else { out.innerHTML='<div class="card" style="border:1px solid var(--red)">'+esc(d.error||'Chyba zápisu')+'</div>'; }
  }catch(e){ out.innerHTML='<div class="card" style="border:1px solid var(--red)">Chyba spojení.</div>'; }
}
init();
</script>
</body>
</html>
